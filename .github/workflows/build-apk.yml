name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:   # the "Run workflow" button on the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the signed release APK
        run: |
          chmod +x gradlew   # uploading through the GitHub web page drops the executable flag
          ./gradlew --no-daemon assembleRelease

      - name: Show the signing certificate
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aurelune-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
